name: Build (Windows)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check public files
        shell: pwsh
        run: ./scripts/check-publication.ps1

      - name: Restore
        run: dotnet restore ./HikFingerprintLabV2.csproj

      - name: Build
        run: dotnet build ./HikFingerprintLabV2.csproj --configuration Release --no-restore

      # There is no scanner attached to GitHub-hosted runners.
      # This checks compilation only, not biometric matching or device behavior.
